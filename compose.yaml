services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-ticket-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: ticket_app
      POSTGRES_PASSWORD: local_ticket_password
    ports:
      - "55432:5432"
    volumes:
      - ticket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_app -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  ticket-postgres-data:
