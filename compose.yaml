services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-ticket-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: ticket_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "55432:5432"
    volumes:
      - ticket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_app -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-ticket-system:local
    container_name: auto-ticket-system-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://ticket_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ticketdb?sslmode=disable
      EXCEL_PATH: /data/employees.xlsx
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dhaka}
      APP_USER: ${APP_USER:?Set APP_USER in .env}
      APP_PASS: ${APP_PASS:?Set APP_PASS in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Auto Ticket System}
    volumes:
      - ./employees.xlsx:/data/employees.xlsx:ro
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: auto-ticket-jenkins:local
    container_name: auto-ticket-system-jenkins
    restart: unless-stopped
    ports:
      - "18081:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  ticket-postgres-data:
  jenkins-home:
