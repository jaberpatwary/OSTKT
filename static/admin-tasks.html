<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#211633" />
  <script>try { if (localStorage.getItem('ost-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (_) {}</script>
  <title>Task Admin Panel — Auto Ticket System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="/theme.css?v=20261126-full-redesign9" />
  <link rel="stylesheet" href="/premium.css?v=20261126-full-redesign9" />
  <style>
    body { font-family: "Manrope", "Hind Siliguri", system-ui, sans-serif; }
    html.dark #taskAdminSurface { background:#151e35 !important; border-color:#334268 !important; }
    html.dark #taskAdminSurface thead { background:#111a2b !important; color:#aab7d0 !important; }
    html.dark #taskAdminSurface tbody { color:#e2e8f0 !important; }
    html.dark #taskAdminSurface input, html.dark #taskAdminSurface select { color:#eaf0ff !important; background:#111a2b !important; border-color:#33415d !important; }
    html.dark .task-admin-card { background:#151e35 !important; border-color:#334268 !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition-duration:.01ms !important; } }
  </style>
  <link rel="stylesheet" href="/experience.css?v=20261126-signal-desk2" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="flex flex-wrap items-center justify-between gap-4 rounded-3xl bg-gradient-to-r from-violet-900 via-indigo-800 to-cyan-800 px-6 py-7 text-white shadow-xl sm:px-8">
      <div><p class="text-xs font-extrabold uppercase tracking-[.2em] text-cyan-200">TEAM EXECUTION</p><h1 class="mt-1 text-3xl font-extrabold tracking-tight">Task Admin Panel</h1><p class="mt-1 text-sm text-indigo-100">Manage task owners and progress.</p></div>
      <nav class="flex flex-wrap gap-2">
        <button id="themeToggle" type="button" data-theme-toggle class="task-header-button" aria-pressed="false">🌙 Dark mode</button>
        <a href="/?view=tasks" class="task-header-button">← Task board</a>
        <a href="/admin" class="task-header-button">Ticket admin</a><a href="/dashboard" class="task-header-button">Ticket dashboard</a><button id="taskAdminRefresh" type="button" class="task-header-button">↻ Refresh</button>
      </nav>
    </header>

    <section class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-4" aria-label="Task status totals">
      <article class="task-admin-card rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-slate-500">All tasks</p><strong id="allCount" class="mt-1 block text-3xl font-extrabold text-slate-900">—</strong></article>
      <article class="task-admin-card rounded-2xl border border-amber-200 bg-amber-50 p-4 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-amber-700">Pending</p><strong id="pendingCount" class="mt-1 block text-3xl font-extrabold text-amber-900">—</strong></article>
      <article class="task-admin-card rounded-2xl border border-blue-200 bg-blue-50 p-4 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-blue-700">In progress</p><strong id="progressCount" class="mt-1 block text-3xl font-extrabold text-blue-900">—</strong></article>
      <article class="task-admin-card rounded-2xl border border-emerald-200 bg-emerald-50 p-4 shadow-sm"><p class="text-xs font-bold uppercase tracking-wide text-emerald-700">Done</p><strong id="doneCount" class="mt-1 block text-3xl font-extrabold text-emerald-900">—</strong></article>
    </section>

    <section id="taskAdminSurface" class="mt-6 overflow-hidden rounded-2xl border border-violet-200 bg-white shadow-sm" aria-labelledby="taskQueueTitle">
      <div class="flex flex-col gap-3 border-b border-violet-100 bg-violet-50/70 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
        <div><p class="text-xs font-extrabold uppercase tracking-wider text-violet-700">TASK WORKSPACE</p><h2 id="taskQueueTitle" class="mt-1 text-xl font-bold text-slate-900">Manage tasks</h2><p id="taskSummary" class="text-sm text-slate-500">Loading tasks…</p></div>
        <div class="flex flex-col gap-2 sm:flex-row">
          <label class="sr-only" for="taskSearch">Search tasks</label><input id="taskSearch" type="search" placeholder="Search details, Given by, owner…" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm" />
          <label class="sr-only" for="taskStatusFilter">Filter tasks by status</label><select id="taskStatusFilter" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm"><option value="">All statuses</option><option value="pending">Pending</option><option value="in_progress">In progress</option><option value="done">Done</option></select>
          <button id="taskAdminClearFilters" type="button" class="hidden rounded-xl border border-violet-200 bg-white px-3 py-2 text-sm font-semibold text-violet-700 hover:bg-violet-50">Clear filters</button>
        </div>
      </div>
      <div id="taskAdminError" role="alert" class="hidden m-4 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800"></div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[900px] text-left text-sm">
          <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-4 py-3">Task details</th><th class="px-4 py-3">Given by</th><th class="px-4 py-3">Assign to</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Action</th></tr></thead>
          <tbody id="taskRows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
      <p id="taskEmpty" class="hidden px-4 py-10 text-center text-sm text-slate-400">No tasks match this filter.</p>
    </section>
  </main>
  <script>
  (() => {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const number = (value) => new Intl.NumberFormat('en').format(value);
    const taskOwners = ['Rupok Kumar Roy', 'Towhedul Islam', 'Md. Imam Hossan Chowdhury', 'Muhammad Fokhrul Hasan', 'Md. Tanvir Ahamed Sarkar', 'Md. Fahad Hossen', 'Mabubul Alam Patwary'];
    const taskAssignees = [...taskOwners, 'IT Team'];
    function taskDisplayFields(task) {
      let createdBy = String(task.created_by || '').trim() || 'Md. Tanvir Ahamed Sarkar';
      let description = String(task.description || '').trim();
      const knownCreator = [...taskOwners].sort((a, b) => b.length - a.length).find((name) => createdBy.toLocaleLowerCase().startsWith(name.toLocaleLowerCase()) && !/[\p{L}\p{N}]/u.test(createdBy.slice(name.length, name.length + 1)));
      if (knownCreator && createdBy.length > knownCreator.length) {
        let extra = createdBy.slice(knownCreator.length).trim().replace(/^['".,:;\s-]+/, '');
        extra = extra.replace(/^(?:er|r|'s|’s|\u098f\u09b0)\s+/i, '').replace(/\b(?:assign(?:ed|ee|ing)?|assing)\b.*$/i, '').trim();
        extra = extra.replace(/\b(?:assign|assing)(?:ed|ee|ing)?(?=[A-Z]).*$/, '').trim();
        if (extra) description = [extra, description].filter(Boolean).join(' ');
        createdBy = knownCreator;
      } else {
        const inline = createdBy.match(/^(.+?)(?:-er|\s+er|\s+r|'s|’s|[- ]\u098f\u09b0)\s*(.+)$/i);
        if (inline) {
          let extra = inline[2].trim().replace(/\b(?:assign(?:ed|ee|ing)?|assing)\b.*$/i, '').trim();
          if (inline[1].trim() && extra) {
            createdBy = inline[1].trim();
            description = [extra, description].filter(Boolean).join(' ');
          }
        }
      }
      return { createdBy, description };
    }
    let tasks = [];

    async function getJSON(path, options) {
      const response = await fetch(path, { cache: 'no-store', ...(options || {}) });
      let data = {};
      try { data = await response.json(); } catch (_) {}
      return { ok: response.ok, data };
    }

    function updateCounts() {
      $('allCount').textContent = number(tasks.length);
      $('pendingCount').textContent = number(tasks.filter((task) => task.status === 'pending').length);
      $('progressCount').textContent = number(tasks.filter((task) => task.status === 'in_progress').length);
      $('doneCount').textContent = number(tasks.filter((task) => task.status === 'done').length);
    }

    function renderTasks() {
      const query = $('taskSearch').value.trim().toLocaleLowerCase();
      const status = $('taskStatusFilter').value;
      const visible = tasks.filter((task) => {
        const haystack = [task.description, task.created_by, task.assigned_to, 'tsk-' + task.id].filter(Boolean).join(' ').toLocaleLowerCase();
        return (!query || haystack.includes(query)) && (!status || task.status === status);
      });
      $('taskSummary').textContent = `${number(visible.length)} shown · ${number(tasks.length)} total tasks`;
      $('taskRows').replaceChildren(...visible.map((task) => {
        const display = taskDisplayFields(task);
        const row = document.createElement('tr');
        const details = document.createElement('td'); details.className = 'max-w-2xl px-4 py-3 align-top';
        const problemBox = document.createElement('div'); problemBox.className = 'task-problem-box task-admin-problem-box';
        const problemLabel = document.createElement('span'); problemLabel.className = 'task-problem-label'; problemLabel.textContent = 'PROBLEM / TASK DETAILS';
        const problemText = document.createElement('p'); problemText.className = 'task-admin-problem-text'; problemText.textContent = display.description || 'No details';
        problemBox.append(problemLabel, problemText); details.append(problemBox);
        const givenByCell = document.createElement('td'); givenByCell.className = 'px-4 py-3';
        const givenBy = document.createElement('select'); givenBy.className = 'max-w-56 rounded-lg border border-slate-300 bg-white px-2 py-2 text-xs'; givenBy.setAttribute('aria-label', 'Given by for task ' + task.id);
        const currentCreator = display.createdBy;
        if (!currentCreator) {
          const missing = new Option('Not recorded', ''); missing.disabled = true; givenBy.append(missing);
        } else if (!taskOwners.includes(currentCreator)) {
          givenBy.append(new Option(currentCreator + ' (current)', currentCreator));
        }
        taskOwners.forEach((name) => givenBy.append(new Option(name, name)));
        givenBy.value = currentCreator; givenByCell.append(givenBy);
        const ownerCell = document.createElement('td'); ownerCell.className = 'px-4 py-3';
        const owner = document.createElement('select'); owner.className = 'max-w-56 rounded-lg border border-slate-300 bg-white px-2 py-2 text-xs';
        const names = [...taskAssignees];
        if (task.assigned_to && !names.includes(task.assigned_to)) names.unshift(task.assigned_to);
        names.forEach((name) => owner.append(new Option(name, name)));
        owner.value = task.assigned_to || 'IT Team'; ownerCell.append(owner);
        const statusCell = document.createElement('td'); statusCell.className = 'px-4 py-3';
        const taskStatus = document.createElement('select'); taskStatus.className = 'rounded-lg border border-slate-300 bg-white px-2 py-2 text-xs';
        [['pending', 'Pending'], ['in_progress', 'In progress'], ['done', 'Done']].forEach(([value, label]) => taskStatus.append(new Option(label, value)));
        taskStatus.value = task.status || 'pending'; statusCell.append(taskStatus);
        const actionCell = document.createElement('td'); actionCell.className = 'px-4 py-3';
        const save = document.createElement('button'); save.type = 'button'; save.className = 'rounded-lg bg-violet-700 px-3 py-2 text-xs font-bold text-white hover:bg-violet-800'; save.textContent = 'Save';
        save.addEventListener('click', async () => {
          save.disabled = true; save.textContent = 'Saving…'; $('taskAdminError').classList.add('hidden');
          try {
            const changes = { description: display.description, assigned_to: owner.value, status: taskStatus.value };
            if (givenBy.value) changes.created_by = givenBy.value;
            const result = await getJSON('/api/tasks/' + encodeURIComponent(task.id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes) });
            if (!result.ok) throw new Error(result.data.error || 'Task update failed.');
            await loadTasks();
          } catch (error) {
            save.disabled = false; save.textContent = 'Retry'; $('taskAdminError').textContent = error.message || 'Task update failed.'; $('taskAdminError').classList.remove('hidden');
          }
        });
        actionCell.append(save); row.append(details, givenByCell, ownerCell, statusCell, actionCell); return row;
      }));
      $('taskEmpty').classList.toggle('hidden', visible.length > 0);
      const hasFilters = Boolean(query || status);
      $('taskAdminClearFilters').classList.toggle('hidden', !hasFilters);
      if (!visible.length) $('taskEmpty').textContent = hasFilters
        ? 'No tasks match these filters. Clear filters or try another search.'
        : 'No tasks have been created yet. Create one from the task board.';
    }

    async function loadTasks() {
      const button = $('taskAdminRefresh'); button.disabled = true; button.textContent = 'Loading…'; $('taskAdminError').classList.add('hidden');
      try {
        const result = await getJSON('/api/tasks?limit=500');
        if (!result.ok) throw new Error(result.data.error || 'Tasks could not be loaded.');
        tasks = Array.isArray(result.data.tasks) ? result.data.tasks : [];
        updateCounts(); renderTasks();
      } catch (error) {
        $('taskAdminError').textContent = error.message || 'Tasks could not be loaded.'; $('taskAdminError').classList.remove('hidden');
      } finally { button.disabled = false; button.textContent = '↻ Refresh'; }
    }

    $('taskSearch').addEventListener('input', renderTasks);
    $('taskStatusFilter').addEventListener('change', renderTasks);
    $('taskAdminClearFilters').addEventListener('click', () => {
      $('taskSearch').value = '';
      $('taskStatusFilter').value = '';
      renderTasks();
      $('taskSearch').focus();
    });
    $('taskAdminRefresh').addEventListener('click', loadTasks);
    loadTasks();
  })();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
